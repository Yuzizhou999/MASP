  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;xiate-map-scene&quot;&gt;
  &lt;style&gt;
    #xiate-map-scene {
      width: 100%;
      color: var(--foreground);
      --scene-background: var(--accent);
      --scene-foreground: var(--accent-foreground);
    }

    #xiate-map-scene .scene-summary,
    #xiate-map-scene .scene-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.9rem;
    }

    #xiate-map-scene .scene-summary {
      justify-content: space-between;
      margin-bottom: 0.45rem;
    }

    #xiate-map-scene .scene-legend {
      color: var(--muted-foreground);
    }

    #xiate-map-scene .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    #xiate-map-scene .legend-dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 999px;
      background: var(--legend-color);
    }

    #xiate-map-scene .scene-stage {
      position: relative;
      width: 100%;
      height: clamp(430px, 76vw, 720px);
      overflow: hidden;
    }

    #xiate-map-scene .scene-svg {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    #xiate-map-scene .scene-svg.is-panning {
      cursor: grabbing;
    }

    #xiate-map-scene .map-grid {
      stroke: var(--scene-foreground);
      stroke-width: 0.08;
      opacity: 0.1;
    }

    #xiate-map-scene .scene-backdrop {
      fill: var(--scene-background);
    }

    #xiate-map-scene .background-cloud {
      fill: none;
      stroke: var(--scene-foreground);
      stroke-width: 0.16;
      stroke-linecap: round;
      opacity: 0.3;
      pointer-events: none;
    }

    #xiate-map-scene .route {
      fill: none;
      stroke: var(--scene-foreground);
      stroke-width: 0.24;
      opacity: 0.8;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    #xiate-map-scene .route-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: pointer;
    }

    #xiate-map-scene .route.reverse-motion {
      stroke-dasharray: 0.55 0.38;
    }

    #xiate-map-scene .route:hover,
    #xiate-map-scene .route.is-selected,
    #xiate-map-scene .route.is-connected {
      stroke: var(--viz-series-1);
      opacity: 1;
    }

    #xiate-map-scene .route.is-selected {
      stroke-width: 0.48;
    }

    #xiate-map-scene .node {
      cursor: pointer;
    }

    #xiate-map-scene .node-mark {
      stroke-width: 0.16;
      vector-effect: non-scaling-stroke;
    }

    #xiate-map-scene .node-lm .node-mark {
      fill: color-mix(in srgb, var(--viz-series-1) 38%, transparent);
      stroke: var(--viz-series-1);
    }

    #xiate-map-scene .node-ap .node-mark {
      fill: color-mix(in srgb, var(--viz-series-2) 45%, transparent);
      stroke: var(--viz-series-2);
    }

    #xiate-map-scene .node-pp .node-mark {
      fill: color-mix(in srgb, var(--viz-series-3) 48%, transparent);
      stroke: var(--viz-series-3);
    }

    #xiate-map-scene .node-cp .node-mark {
      fill: color-mix(in srgb, var(--viz-series-4) 48%, transparent);
      stroke: var(--viz-series-4);
    }

    #xiate-map-scene .node:hover .node-mark,
    #xiate-map-scene .node.is-selected .node-mark {
      fill: var(--scene-foreground);
      stroke: var(--scene-background);
    }

    #xiate-map-scene .node-label {
      fill: var(--scene-foreground);
      paint-order: stroke;
      stroke: var(--scene-background);
      stroke-width: 0.42;
      stroke-linejoin: round;
      font-weight: 500;
      pointer-events: none;
    }

    #xiate-map-scene .node-label.lm-label {
      opacity: 0;
    }

    #xiate-map-scene .show-lm-labels .node-label.lm-label,
    #xiate-map-scene .node:hover .node-label,
    #xiate-map-scene .node.is-selected .node-label {
      opacity: 1;
    }

    #xiate-map-scene .scene-detail {
      min-height: 1.5rem;
      margin-top: 0.45rem;
      color: var(--muted-foreground);
    }

    @media (max-width: 480px) {
      #xiate-map-scene .scene-summary {
        align-items: flex-start;
        flex-direction: column;
      }

      #xiate-map-scene .scene-stage {
        height: 470px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #xiate-map-scene * {
        scroll-behavior: auto;
      }
    }
  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;xiate-map-scene&quot;);
      const svg = document.getElementById(&quot;xiate-scene-svg&quot;);
      const backdrop = document.getElementById(&quot;xiate-scene-backdrop&quot;);
      const grid = document.getElementById(&quot;xiate-scene-grid&quot;);
      const background = document.getElementById(&quot;xiate-background-cloud&quot;);
      const routeHitsGroup = document.getElementById(&quot;xiate-scene-route-hits&quot;);
      const routesGroup = document.getElementById(&quot;xiate-scene-routes&quot;);
      const nodesGroup = document.getElementById(&quot;xiate-scene-nodes&quot;);
      const detail = document.getElementById(&quot;xiate-scene-detail&quot;);
      const stats = document.getElementById(&quot;xiate-scene-stats&quot;);
      const model = JSON.parse(document.getElementById(&quot;xiate-map-model-data&quot;).textContent);
      const svgNs = &quot;http://www.w3.org/2000/svg&quot;;
      const nodeById = new Map(model.nodes.map((node) =&gt; [node.id, node]));
      const incoming = new Map(model.nodes.map((node) =&gt; [node.id, 0]));
      const outgoing = new Map(model.nodes.map((node) =&gt; [node.id, 0]));
      const nodeElements = new Map();
      const edgeElements = new Map();

      model.edges.forEach((edge) =&gt; {
        outgoing.set(edge.start, (outgoing.get(edge.start) || 0) + 1);
        incoming.set(edge.end, (incoming.get(edge.end) || 0) + 1);
      });

      stats.textContent = `${model.stats.nodeCount} 个节点 · ${model.stats.edgeCount} 条有向路径 · ${model.stats.stronglyConnected ? &quot;全图强连通&quot; : &quot;存在不可达区域&quot;}`;

      const bounds = model.metadata.bounds;
      const padding = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY) * 0.035;
      const initialView = {
        x: bounds.minX - padding,
        y: -bounds.maxY - padding,
        w: bounds.maxX - bounds.minX + padding * 2,
        h: bounds.maxY - bounds.minY + padding * 2,
      };
      let view = { ...initialView };
      let panState = null;
      let selectedElement = null;

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS(svgNs, name);
        Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        return element;
      }

      function applyView() {
        svg.setAttribute(&quot;viewBox&quot;, `${view.x} ${view.y} ${view.w} ${view.h}`);
        const zoom = initialView.w / view.w;
        root.classList.toggle(&quot;show-lm-labels&quot;, zoom &gt; 2.35);
      }

      function clearSelection() {
        if (selectedElement) {
          selectedElement.classList.remove(&quot;is-selected&quot;);
          if (selectedElement.classList.contains(&quot;route&quot;)) {
            selectedElement.setAttribute(&quot;marker-end&quot;, &quot;url(#xiate-route-arrow)&quot;);
          }
        }
        edgeElements.forEach((element) =&gt; element.classList.remove(&quot;is-connected&quot;));
        selectedElement = null;
      }

      function selectNode(node, element) {
        clearSelection();
        selectedElement = element;
        element.classList.add(&quot;is-selected&quot;);
        model.edges.forEach((edge) =&gt; {
          if (edge.start === node.id || edge.end === node.id) {
            edgeElements.get(edge.id).classList.add(&quot;is-connected&quot;);
          }
        });
        detail.textContent = `${node.id} · ${node.className} · 坐标 (${node.x.toFixed(3)}, ${node.y.toFixed(3)}) · 入 ${incoming.get(node.id)} / 出 ${outgoing.get(node.id)}`;
      }

      function selectEdge(edge, element) {
        clearSelection();
        selectedElement = element;
        element.classList.add(&quot;is-selected&quot;);
        element.setAttribute(&quot;marker-end&quot;, &quot;url(#xiate-route-arrow-selected)&quot;);
        const movement = edge.motionDirection === 1 ? &quot;倒向行驶&quot; : &quot;正向行驶&quot;;

      }

      [backdrop, grid].forEach((element) =&gt; {
        element.setAttribute(&quot;x&quot;, initialView.x);
        element.setAttribute(&quot;y&quot;, initialView.y);
        element.setAttribute(&quot;width&quot;, initialView.w);
        element.setAttribute(&quot;height&quot;, initialView.h);
      });

      const step = model.background.step;
      const cloudCommands = [];
      model.background.cells.forEach(([cellX, cellY]) =&gt; {
        const x = cellX * step;
        const y = -cellY * step;
        cloudCommands.push(`M${x.toFixed(2)},${y.toFixed(2)}h0.08`);
      });
      background.setAttribute(&quot;d&quot;, cloudCommands.join(&quot;&quot;));

      model.edges.forEach((edge) =&gt; {
        const routeData = {
          d: `M ${edge.p0[0]} ${-edge.p0[1]} C ${edge.p1[0]} ${-edge.p1[1]}, ${edge.p2[0]} ${-edge.p2[1]}, ${edge.p3[0]} ${-edge.p3[1]}`,
          &quot;data-edge-id&quot;: edge.id,
          &quot;data-start&quot;: edge.start,
          &quot;data-end&quot;: edge.end,

        const path = createSvgElement(&quot;path&quot;, {
          ...routeData,
          class: `route${edge.motionDirection === 1 ? &quot; reverse-motion&quot; : &quot;&quot;}`,
          &quot;marker-end&quot;: &quot;url(#xiate-route-arrow)&quot;,
        });
        const hitPath = createSvgElement(&quot;path&quot;, { ...routeData, class: &quot;route-hit&quot; });
        const title = createSvgElement(&quot;title&quot;);
        title.textContent = `${edge.start} 到 ${edge.end}，长度 ${edge.length.toFixed(2)} 米`;
        path.appendChild(title);
        hitPath.addEventListener(&quot;click&quot;, (event) =&gt; {
          event.stopPropagation();
          selectEdge(edge, path);
        });
        routeHitsGroup.appendChild(hitPath);
        routesGroup.appendChild(path);
        edgeElements.set(edge.id, path);
      });

      model.nodes.forEach((node) =&gt; {
        const group = createSvgElement(&quot;g&quot;, {
          class: `node node-${node.type.toLowerCase()}`,
          &quot;data-node-id&quot;: node.id,
          transform: `translate(${node.x} ${-node.y})`,
        });
        const radius = node.type === &quot;LM&quot; ? 0.28 : 0.42;
        const circle = createSvgElement(&quot;circle&quot;, { class: &quot;node-mark&quot;, r: radius });
        const title = createSvgElement(&quot;title&quot;);
        title.textContent = `${node.id}，${node.className}`;
        circle.appendChild(title);

        const label = createSvgElement(&quot;text&quot;, {
          class: `node-label${node.type === &quot;LM&quot; ? &quot; lm-label&quot; : &quot;&quot;}`,
          x: radius + 0.22,
          y: -radius - 0.18,
          &quot;font-size&quot;: node.type === &quot;LM&quot; ? 1.35 : 1.55,
        });
        label.textContent = node.id;

        group.appendChild(circle);
        group.appendChild(label);
        group.addEventListener(&quot;click&quot;, (event) =&gt; {
          event.stopPropagation();
          selectNode(node, group);
        });
        nodesGroup.appendChild(group);
        nodeElements.set(node.id, group);

      function clientToMap(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        return {
          x: view.x + ((clientX - rect.left) / rect.width) * view.w,
          y: view.y + ((clientY - rect.top) / rect.height) * view.h,

      svg.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        if (event.target.closest(&quot;.node, .route-hit&quot;)) return;
        panState = {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          viewX: view.x,
          viewY: view.y,
          viewW: view.w,
          viewH: view.h,

        svg.setPointerCapture(event.pointerId);

      });

      svg.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
        if (!panState || panState.pointerId !== event.pointerId) return;
        const rect = svg.getBoundingClientRect();
        const dx = ((event.clientX - panState.clientX) / rect.width) * panState.viewW;
        const dy = ((event.clientY - panState.clientY) / rect.height) * panState.viewH;
        view.x = panState.viewX - dx;
        view.y = panState.viewY - dy;

      svg.addEventListener(&quot;pointercancel&quot;, endPan);

        const factor = Math.exp(event.deltaY * 0.0012);
        const nextWidth = Math.min(initialView.w * 1.3, Math.max(initialView.w / 28, view.w * factor));
        const ratio = nextWidth / view.w;
        const nextHeight = view.h * ratio;
        view.x = anchor.x - (anchor.x - view.x) * ratio;
        view.y = anchor.y - (anchor.y - view.y) * ratio;

        view.h = nextHeight;

        view = { ...initialView };

        clearSelection();
        detail.textContent = &quot;拖拽平移 · 滚轮缩放 · 双击复位 · 点击节点或路线查看详情&quot;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
