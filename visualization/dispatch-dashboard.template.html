<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASP 调度场景</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #1d2630;
  --muted: #687582;
  --line: #d8e0e7;
  --fork: #2774d4;
  --jack: #e27d2d;
  --shared: #1e9b73;
  --danger: #bf3e3e;
  --shadow: 0 5px 18px rgb(24 39 54 / 8%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button, input, select { font: inherit; }
button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover { border-color: #8aa0b2; background: #f8fafb; }
button[aria-pressed="true"] { color: #fff; border-color: #1d5eae; background: #1d5eae; }
.app { max-width: 1540px; margin: 0 auto; padding: 20px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 25px; letter-spacing: 0; }
.subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; }
.top-meta { color: var(--muted); font-size: 12px; text-align: right; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.map-panel { min-width: 0; overflow: hidden; }
.map-panel.is-expanded {
  position: fixed;
  inset: 12px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  max-width: none;
  box-shadow: 0 18px 60px rgb(24 39 54 / 24%);
}
.map-panel.is-expanded .map-wrap { flex: 1 1 auto; min-height: 0; }
.map-panel.is-expanded #map { height: 100%; min-height: 0; }
body.map-expanded { overflow: hidden; }
.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.panel-heading h2 { margin: 0; font-size: 15px; }
.map-wrap { position: relative; min-height: 620px; background: #f8fbfd; }
#map { display: block; width: 100%; height: 620px; touch-action: none; }
.map-toolbar { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.map-toolbar button { padding: 5px 8px; background: rgb(255 255 255 / 92%); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 9px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.swatch.fork { background: var(--fork); } .swatch.jack { background: var(--jack); } .swatch.shared { background: var(--shared); }
.road { fill: none; stroke-width: .22; opacity: .3; vector-effect: non-scaling-stroke; pointer-events: none; }
.road.fork { stroke: var(--fork); } .road.jack { stroke: var(--jack); }
.road.shared { stroke: #82919d; opacity: .22; }
.road.active { stroke: #20313f; stroke-width: .7; opacity: .95; }
.shared-overlay { fill: none; stroke: var(--shared); stroke-width: .75; stroke-dasharray: 1.2 .8; opacity: .42; vector-effect: non-scaling-stroke; pointer-events: none; }
.node { stroke: #fff; stroke-width: .28; vector-effect: non-scaling-stroke; }
.node.LM { fill: #a6b4bf; } .node.AP { fill: #7c4da7; } .node.PP, .node.CP { fill: #3c9e7a; }
.node-label { font-size: 2.1px; fill: #3a4a56; paint-order: stroke; stroke: #f8fbfd; stroke-width: .7px; opacity: 0; pointer-events: none; }
.show-labels .node-label { opacity: .82; }
.vehicle { cursor: pointer; stroke: #fff; stroke-width: .34; vector-effect: non-scaling-stroke; }
.vehicle.fork { fill: var(--fork); } .vehicle.jack { fill: var(--jack); }
.vehicle.selected { stroke: #14212b; stroke-width: .65; }
.vehicle-label { font-size: 2.3px; font-weight: 700; fill: #17232c; paint-order: stroke; stroke: #fff; stroke-width: .8px; pointer-events: none; }
.route-highlight { fill: none; stroke: #192630; stroke-width: .85; opacity: .8; vector-effect: non-scaling-stroke; pointer-events: none; }
.side { display: grid; gap: 16px; }
.controls { padding: 13px 15px; }
.control-row { display: flex; align-items: center; gap: 8px; }
.control-row + .control-row { margin-top: 10px; }
.control-row input[type="range"] { flex: 1; accent-color: #1d5eae; }
.time-readout { min-width: 92px; color: #1d5eae; font-variant-numeric: tabular-nums; font-size: 13px; }
.speed { width: 74px; padding: 6px; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; }
.stat-value { font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-label { margin-top: 4px; color: var(--muted); font-size: 11px; }
.section-body { padding: 11px 15px; }
.list { display: grid; gap: 6px; max-height: 232px; overflow: auto; }
.list-row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; width: 100%; border: 1px solid transparent; border-radius: 5px; padding: 7px 6px; background: #f8fafb; text-align: left; }
.list-row:hover, .list-row.selected { border-color: #9ab7d1; background: #eef5fb; }
.dot { width: 8px; height: 8px; border-radius: 50%; } .dot.fork { background: var(--fork); } .dot.jack { background: var(--jack); }
.row-main { min-width: 0; } .row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
.row-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; margin-top: 2px; }
.badge { padding: 2px 5px; border-radius: 4px; background: #e8edf1; color: #546572; font-size: 10px; white-space: nowrap; }
.badge.done { background: #dff3e9; color: #19704b; } .badge.active { background: #e3eefc; color: #1d5eae; } .badge.wait { background: #fff0d9; color: #8d5b13; }
.timeline { max-height: 260px; overflow: auto; }
.event { display: grid; grid-template-columns: 52px 1fr; gap: 7px; padding: 6px 0; border-bottom: 1px solid #edf0f3; font-size: 11px; }
.event-time { color: var(--muted); font-variant-numeric: tabular-nums; } .event-type { font-weight: 600; } .event-detail { color: var(--muted); margin-top: 2px; }
.empty { padding: 16px 4px; color: var(--muted); font-size: 12px; }
@media (max-width: 1050px) { .layout { grid-template-columns: 1fr; } .side { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side .wide { grid-column: 1 / -1; } }
@media (max-width: 680px) { .app { padding: 12px; } .topbar { align-items: flex-start; flex-direction: column; } .top-meta { text-align: left; } .side { grid-template-columns: 1fr; } #map { height: 500px; } .map-wrap { min-height: 500px; } }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div><h1>MASP 多车多任务调度场景</h1><div id="subtitle" class="subtitle"></div></div>
    <div id="meta" class="top-meta"></div>
  </header>
  <div class="layout">
    <section class="panel map-panel">
      <div class="panel-heading"><h2>仓库地图与实时车辆位置</h2><span id="map-status" class="subtitle"></span></div>
      <div class="map-wrap">
        <svg id="map" role="img" aria-label="仓库调度地图"></svg>
        <div class="map-toolbar"><button id="toggle-map-size" type="button" aria-pressed="false">放大地图</button><button id="toggle-labels" type="button" aria-pressed="false">显示站点标签</button><button id="reset-view" type="button">重置视图</button></div>
      </div>
      <div class="legend"><span><i class="swatch fork"></i>Fork 车</span><span><i class="swatch jack"></i>Jack 车</span><span><i class="swatch shared"></i>共享路径</span><span>紫色节点：工位 AP</span></div>
    </section>
    <aside class="side">
      <section class="panel controls wide">
        <div class="panel-heading" style="padding:0 0 10px;border:0"><h2>时间控制</h2><span id="play-state" class="badge">暂停</span></div>
        <div class="control-row"><button id="play" type="button">播放</button><button id="reset-time" type="button">回到开始</button><input id="time" type="range" min="0" value="0" step="100"><span id="time-readout" class="time-readout">00:00.0</span><select id="speed" class="speed" aria-label="播放速度"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select></div>
      </section>
      <section class="panel controls wide"><div id="stats" class="stats-grid"></div></section>
      <section class="panel"><div class="panel-heading"><h2>车辆状态</h2><span id="vehicle-count" class="badge"></span></div><div id="vehicles" class="section-body list"></div></section>
      <section class="panel"><div class="panel-heading"><h2>任务状态</h2><span id="task-count" class="badge"></span></div><div id="tasks" class="section-body list"></div></section>
      <section class="panel wide"><div class="panel-heading"><h2>事件时间线</h2><span id="event-count" class="badge"></span></div><div id="timeline" class="section-body timeline"></div></section>
    </aside>
  </div>
</main>
<script>
const DATA = __MASP_DASHBOARD_JSON__;
const svg = document.getElementById('map');
const bounds = DATA.map.bounds || {minX: 0, maxX: 100, minY: 0, maxY: 100};
const pad = 4;
const mapW = Math.max(1, (bounds.maxX - bounds.minX) + pad * 2);
const mapH = Math.max(1, (bounds.maxY - bounds.minY) + pad * 2);
const minX = bounds.minX - pad;
const maxY = bounds.maxY + pad;
svg.setAttribute('viewBox', `0 0 ${mapW} ${mapH}`);
const ns = 'http://www.w3.org/2000/svg';
const edgeById = new Map(DATA.map.edges.map(edge => [edge.id, edge]));
const nodeById = new Map(DATA.map.nodes.map(node => [node.id, node]));
const plansByVehicle = new Map();
for (const plan of DATA.plans) {
  const plans = plansByVehicle.get(plan.vehicleId) || [];
  plans.push(plan);
  plansByVehicle.set(plan.vehicleId, plans);
}
for (const plans of plansByVehicle.values()) plans.sort((a,b) => a.createdAtMs - b.createdAtMs);
const vehicleById = new Map(DATA.vehicles.map(vehicle => [vehicle.vehicleId, vehicle]));
const taskById = new Map(DATA.tasks.map(task => [task.taskId, task]));
let selectedVehicle = null;
let currentMs = 0;
let playing = false;
let timer = null;
let lastTick = 0;
const colors = {fork: '#2774d4', jack: '#e27d2d', shared: '#1e9b73'};

function xCoord(x) { return x - minX; }
function yCoord(y) { return maxY - y; }
function point(p) { return `${xCoord(p[0])},${yCoord(p[1])}`; }
function pathD(edge) { return `M ${point(edge.p0)} C ${point(edge.p1)} ${point(edge.p2)} ${point(edge.p3)}`; }
function make(tag, attrs = {}) { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; }
function fmtMs(ms) { const seconds = Math.max(0, ms) / 1000; const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); const s = Math.floor(seconds % 60); const tenth = Math.floor(seconds % 1 * 10); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${tenth}`; }
function label(value) { return String(value || '').replaceAll('_', ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
function safe(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cubic(p0,p1,p2,p3,t) { const u=1-t; return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]; }

function renderMap() {
  svg.replaceChildren();
  const roads = make('g');
  for (const edge of DATA.map.edges) {
    const path = make('path', {d:pathD(edge), class:`road ${edge.group || 'shared'}`, 'data-edge':edge.id});
    roads.appendChild(path);
  }
  svg.appendChild(roads);
  const overlays = make('g');
  for (const edge of DATA.map.sharedOverlays || []) overlays.appendChild(make('path', {d:`M ${point(edge.p0)} C ${point(edge.p1)} ${point(edge.p2)} ${point(edge.p3)}`, class:'shared-overlay'}));
  svg.appendChild(overlays);
  const nodes = make('g');
  for (const node of DATA.map.nodes) {
    const g = make('g', {class:'node', 'data-node':node.id});
    g.appendChild(make('circle', {cx:xCoord(node.x), cy:yCoord(node.y), r:node.type === 'AP' ? .62 : .34, class:`node ${node.type}`}));
    const text = make('text', {x:xCoord(node.x)+.7, y:yCoord(node.y)-.7, class:'node-label'}); text.textContent = node.id.replace(/^.*:/,''); g.appendChild(text); nodes.appendChild(g);
  }
  svg.appendChild(nodes);
  svg.appendChild(make('path', {id:'route-highlight', class:'route-highlight'}));
  svg.appendChild(make('g', {id:'vehicles-layer'}));
  drawVehicles();
}

function positionFor(vehicleId, timeMs) {
  const plans = plansByVehicle.get(vehicleId) || [];
  const vehicle = vehicleById.get(vehicleId);
  if (!plans.length) return {point: nodeById.get(vehicle?.initialNodeId), segment:null};
  const segments = plans.flatMap(plan => plan.segments).sort((a,b) => a.startMs - b.startMs);
  let previous = null;
  for (const segment of segments) {
    if (timeMs < segment.startMs) break;
    if (timeMs <= segment.endMs) {
      const edge = segment.edgeId ? edgeById.get(segment.edgeId) : null;
      if (edge && segment.endMs > segment.startMs) {
        const p = cubic(edge.p0,edge.p1,edge.p2,edge.p3,Math.max(0,Math.min(1,(timeMs-segment.startMs)/(segment.endMs-segment.startMs))));
        return {point:{x:p[0],y:p[1]},segment};
      }
      return {point:nodeById.get(segment.startNodeId) || nodeById.get(segment.endNodeId),segment};
    }
    previous = segment;
  }
  const nodeId = previous?.endNodeId || vehicle?.initialNodeId;
  return {point:nodeById.get(nodeId),segment:previous};
}

function drawVehicles() {
  const layer = document.getElementById('vehicles-layer'); layer.replaceChildren();
  for (const vehicle of DATA.vehicles) {
    const located = positionFor(vehicle.vehicleId, currentMs); const p = located.point;
    if (!p) continue;
    const group = make('g', {class:`vehicle-group ${selectedVehicle === vehicle.vehicleId ? 'selected' : ''}`, 'data-vehicle':vehicle.vehicleId});
    const marker = make('circle', {cx:xCoord(p.x),cy:yCoord(p.y),r:.9,class:`vehicle ${vehicle.robotGroup} ${selectedVehicle === vehicle.vehicleId ? 'selected' : ''}`});
    marker.addEventListener('click', () => { selectedVehicle = selectedVehicle === vehicle.vehicleId ? null : vehicle.vehicleId; drawRoute(); drawVehicles(); renderLists(); });
    group.appendChild(marker);
    const text = make('text', {x:xCoord(p.x)+1.1,y:yCoord(p.y)-1.1,class:'vehicle-label'}); text.textContent = vehicle.vehicleId; group.appendChild(text); layer.appendChild(group);
  }
}
function drawRoute() {
  const route = document.getElementById('route-highlight');
  if (!selectedVehicle) { route.setAttribute('d',''); return; }
  const plans = plansByVehicle.get(selectedVehicle) || [];
  const paths = plans.flatMap(plan => plan.segments).map(segment => segment.edgeId ? edgeById.get(segment.edgeId) : null).filter(Boolean);
  route.setAttribute('d', paths.map(pathD).join(' '));
}

function taskStatus(task) {
  if (task.completedAtMs != null && currentMs >= task.completedAtMs) return ['已完成','done'];
  if (task.pickedAtMs != null && currentMs >= task.pickedAtMs) return ['运输中','active'];
  if (currentMs < task.releaseTimeMs) return ['未释放','wait'];
  return ['排队中','wait'];
}
function vehicleStatus(vehicle) {
  const plans = plansByVehicle.get(vehicle.vehicleId) || [];
  const segments = plans.flatMap(plan => plan.segments);
  const active = segments.find(segment => currentMs >= segment.startMs && currentMs <= segment.endMs);
  if (active?.kind === 'pickup' || active?.kind === 'dropoff') return [active.kind === 'pickup' ? '取货服务' : '放货服务','active',active];
  if (active?.kind === 'wait') return ['等待','wait',active];
  if (active?.kind === 'traverse') return ['行驶中','active',active];
  if (currentMs < (plans[0]?.createdAtMs || 0)) return ['待命','wait',active];
  return ['空闲','done',active];
}
function renderLists() {
  const vehicleEl = document.getElementById('vehicles'); vehicleEl.replaceChildren();
  for (const vehicle of DATA.vehicles) {
    const [status, cls, segment] = vehicleStatus(vehicle); const row = document.createElement('button'); row.type='button'; row.className=`list-row ${selectedVehicle===vehicle.vehicleId?'selected':''}`; row.innerHTML=`<i class="dot ${safe(vehicle.robotGroup)}"></i><span class="row-main"><span class="row-title">${safe(vehicle.vehicleId)}</span><span class="row-detail">${safe(segment?.edgeId || segment?.startNodeId || vehicle.initialNodeId || '')}</span></span><span class="badge ${cls}">${status}</span>`; row.addEventListener('click',()=>{selectedVehicle=selectedVehicle===vehicle.vehicleId?null:vehicle.vehicleId;drawRoute();drawVehicles();renderLists();}); vehicleEl.appendChild(row);
  }
  document.getElementById('vehicle-count').textContent = `${DATA.vehicles.length} 辆`;
  const taskEl = document.getElementById('tasks'); taskEl.replaceChildren();
  for (const task of DATA.tasks) { const [status, cls] = taskStatus(task); const row = document.createElement('button'); row.type='button'; row.className='list-row'; row.innerHTML=`<i class="dot ${safe(task.requiredRobotGroup)}"></i><span class="row-main"><span class="row-title">${safe(task.taskId)}</span><span class="row-detail">${safe(task.pickupNodeId)} → ${safe(task.dropoffNodeId)}</span></span><span class="badge ${cls}">${status}</span>`; row.addEventListener('click',()=>{if(task.assignedVehicleId){selectedVehicle=task.assignedVehicleId;drawRoute();drawVehicles();renderLists();}}); taskEl.appendChild(row); }
  document.getElementById('task-count').textContent = `${DATA.tasks.length} 个`;
}
function renderStats() {
  const completed = DATA.tasks.filter(task => taskStatus(task)[0] === '已完成').length;
  const moving = DATA.vehicles.filter(vehicle => vehicleStatus(vehicle)[0] === '行驶中').length;
  const waiting = DATA.vehicles.filter(vehicle => vehicleStatus(vehicle)[0] === '等待').length;
  const metrics = DATA.metrics || {};
  document.getElementById('stats').innerHTML = `<div class="stat"><div class="stat-value">${completed}/${DATA.tasks.length}</div><div class="stat-label">当前完成任务</div></div><div class="stat"><div class="stat-value">${moving}</div><div class="stat-label">行驶车辆</div></div><div class="stat"><div class="stat-value">${waiting}</div><div class="stat-label">等待车辆</div></div><div class="stat"><div class="stat-value">${Number(metrics.completedDropoffsPerHour||0).toFixed(1)}</div><div class="stat-label">完成吞吐 / 小时</div></div>`;
  document.getElementById('map-status').textContent = `${moving} 行驶 · ${waiting} 等待 · ${selectedVehicle ? `已选 ${selectedVehicle}` : '点击车辆查看路线'}`;
}
function renderTimeline() {
  const el = document.getElementById('timeline'); const visible = DATA.events.filter(event => event.timeMs <= currentMs).slice(-18).reverse(); el.replaceChildren();
  document.getElementById('event-count').textContent = `${visible.length}/${DATA.events.length}`;
  if (!visible.length) { el.innerHTML='<div class="empty">时间线上还没有发生事件</div>'; return; }
  for (const event of visible) { const payload=event.payload||{}; const detail=payload.vehicleId || payload.taskId || payload.planId || ''; const row=document.createElement('div'); row.className='event'; row.innerHTML=`<div class="event-time">${fmtMs(event.timeMs)}</div><div><div class="event-type">${safe(label(event.type))}</div><div class="event-detail">${safe(detail)}</div></div>`; el.appendChild(row); }
  document.getElementById('event-count').textContent = `${visible.length}/${DATA.events.length}`;
}
function render() {
  document.getElementById('time').value = String(currentMs); document.getElementById('time-readout').textContent = fmtMs(currentMs); document.getElementById('play-state').textContent = playing ? '播放中' : '暂停'; document.getElementById('play-state').className=`badge ${playing?'active':''}`; renderStats(); drawVehicles(); renderLists(); renderTimeline();
}
function setTime(value) { currentMs = Math.max(0, Math.min(DATA.endTimeMs, Number(value))); render(); }
function tick(now) { if (!playing) return; if (!lastTick) lastTick=now; const speed=Number(document.getElementById('speed').value); setTime(currentMs + (now-lastTick)*speed); lastTick=now; if (currentMs >= DATA.endTimeMs) { playing=false; lastTick=0; render(); return; } timer=requestAnimationFrame(tick); }
document.getElementById('play').addEventListener('click',()=>{playing=!playing;lastTick=0;if(playing)timer=requestAnimationFrame(tick);render();});
document.getElementById('reset-time').addEventListener('click',()=>{playing=false;lastTick=0;setTime(0);});
document.getElementById('time').max=String(DATA.endTimeMs); document.getElementById('time').addEventListener('input',event=>{playing=false;setTime(event.target.value);});
document.getElementById('toggle-labels').addEventListener('click',event=>{document.body.classList.toggle('show-labels');event.currentTarget.setAttribute('aria-pressed',String(document.body.classList.contains('show-labels')));});
const mapPanel = document.querySelector('.map-panel');
const toggleMapSize = document.getElementById('toggle-map-size');
function setMapExpanded(expanded) {
  mapPanel.classList.toggle('is-expanded', expanded);
  document.body.classList.toggle('map-expanded', expanded);
  toggleMapSize.setAttribute('aria-pressed', String(expanded));
  toggleMapSize.textContent = expanded ? '关闭放大' : '放大地图';
}
toggleMapSize.addEventListener('click',()=>setMapExpanded(!mapPanel.classList.contains('is-expanded')));
document.addEventListener('keydown',event=>{if(event.key === 'Escape' && mapPanel.classList.contains('is-expanded')) setMapExpanded(false);});
document.getElementById('reset-view').addEventListener('click',()=>{svg.setAttribute('viewBox',`0 0 ${mapW} ${mapH}`);});
document.getElementById('subtitle').textContent=`${DATA.scenarioId} · ${DATA.vehicles.length} 辆车 · ${DATA.tasks.length} 个任务`;
const replayModeLabel=DATA.replayMode==='online'?'在线调度事件回放':'本地离线回放';
document.getElementById('meta').textContent=`仿真时长 ${fmtMs(DATA.endTimeMs)} · seed ${DATA.seed ?? '-'} · ${replayModeLabel}`;
renderMap(); drawRoute(); render();
</script>
</body>
</html>
