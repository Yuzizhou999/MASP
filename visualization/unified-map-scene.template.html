<div id="xiate-unified-map-scene">
  <style>
    #xiate-unified-map-scene {
      width: 100%;
      color: var(--foreground);
      --scene-background: var(--accent);
      --scene-foreground: var(--accent-foreground);
    }

    #xiate-unified-map-scene .scene-header,
    #xiate-unified-map-scene .scene-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.9rem;
    }

    #xiate-unified-map-scene .scene-header {
      justify-content: space-between;
      margin-bottom: 0.45rem;
    }

    #xiate-unified-map-scene .scene-legend {
      color: var(--muted-foreground);
    }

    #xiate-unified-map-scene .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    #xiate-unified-map-scene .legend-mark {
      width: 0.72rem;
      height: 0.72rem;
      background: var(--mark-color);
    }

    #xiate-unified-map-scene .legend-fork {
      border-radius: 999px;
    }

    #xiate-unified-map-scene .legend-jack {
      border-radius: 0.1rem;
    }

    #xiate-unified-map-scene .legend-shared {
      transform: rotate(45deg) scale(0.78);
    }

    #xiate-unified-map-scene .scene-stage {
      position: relative;
      width: 100%;
      height: clamp(440px, 76vw, 740px);
      overflow: hidden;
    }

    #xiate-unified-map-scene .scene-svg {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    #xiate-unified-map-scene .scene-svg.is-panning {
      cursor: grabbing;
    }

    #xiate-unified-map-scene .scene-backdrop {
      fill: var(--scene-background);
    }

    #xiate-unified-map-scene .map-grid {
      fill: none;
      stroke: var(--scene-foreground);
      stroke-width: 0.08;
      opacity: 0.09;
    }

    #xiate-unified-map-scene .background-cloud {
      fill: none;
      stroke-width: 0.15;
      stroke-linecap: round;
      opacity: 0.13;
      pointer-events: none;
    }

    #xiate-unified-map-scene .background-cloud.fork {
      stroke: var(--viz-series-1);
    }

    #xiate-unified-map-scene .background-cloud.jack {
      stroke: var(--viz-series-2);
    }

    #xiate-unified-map-scene .edge {
      fill: none;
      stroke-width: 0.23;
      opacity: 0.76;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    #xiate-unified-map-scene .edge.fork {
      stroke: var(--viz-series-1);
    }

    #xiate-unified-map-scene .edge.jack {
      stroke: var(--viz-series-2);
    }

    #xiate-unified-map-scene .edge.reverse-motion {
      stroke-dasharray: 0.55 0.38;
    }

    #xiate-unified-map-scene .edge.is-selected {
      stroke: var(--scene-foreground);
      stroke-width: 0.52;
      opacity: 1;
    }

    #xiate-unified-map-scene .route-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: pointer;
    }

    #xiate-unified-map-scene .shared-overlay {
      fill: none;
      stroke: var(--viz-series-3);
      stroke-width: 0.55;
      stroke-dasharray: 0.7 0.42;
      opacity: 0.9;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    #xiate-unified-map-scene .node {
      cursor: pointer;
    }

    #xiate-unified-map-scene .node-mark {
      stroke-width: 0.16;
      vector-effect: non-scaling-stroke;
    }

    #xiate-unified-map-scene .node.fork-only .node-mark {
      fill: color-mix(in srgb, var(--viz-series-1) 42%, transparent);
      stroke: var(--viz-series-1);
    }

    #xiate-unified-map-scene .node.jack-only .node-mark {
      fill: color-mix(in srgb, var(--viz-series-2) 42%, transparent);
      stroke: var(--viz-series-2);
    }

    #xiate-unified-map-scene .node.shared .node-mark {
      fill: color-mix(in srgb, var(--viz-series-3) 48%, transparent);
      stroke: var(--viz-series-3);
    }

    #xiate-unified-map-scene .node:hover .node-mark,
    #xiate-unified-map-scene .node.is-selected .node-mark {
      fill: var(--scene-foreground);
      stroke: var(--scene-background);
    }

    #xiate-unified-map-scene .node-label {
      fill: var(--scene-foreground);
      paint-order: stroke;
      stroke: var(--scene-background);
      stroke-width: 0.42;
      stroke-linejoin: round;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
    }

    #xiate-unified-map-scene .show-station-labels .node-label.station-label,
    #xiate-unified-map-scene .show-all-labels .node-label,
    #xiate-unified-map-scene .node:hover .node-label,
    #xiate-unified-map-scene .node.is-selected .node-label {
      opacity: 1;
    }

    #xiate-unified-map-scene .layer-hidden {
      display: none;
    }

    #xiate-unified-map-scene .scene-detail {
      min-height: 1.5rem;
      margin-top: 0.45rem;
      color: var(--muted-foreground);
    }

    @media (max-width: 560px) {
      #xiate-unified-map-scene .scene-header {
        align-items: flex-start;
        flex-direction: column;
      }

      #xiate-unified-map-scene .scene-stage {
        height: 500px;
      }
    }
  </style>

  <div class="scene-header text-small">
    <div id="xiate-unified-stats"></div>
    <div class="viz-controls" aria-label="地图显示层">
      <label class="form-check">
        <input id="xiate-show-fork" class="form-check-input" type="checkbox" checked>
        <span class="form-check-label">fork 路径层</span>
      </label>
      <label class="form-check">
        <input id="xiate-show-jack" class="form-check-input" type="checkbox" checked>
        <span class="form-check-label">jack 路径层</span>
      </label>
      <label class="form-check">
        <input id="xiate-show-shared" class="form-check-input" type="checkbox" checked>
        <span class="form-check-label">共享区域高亮</span>
      </label>
    </div>
  </div>

  <div class="scene-legend text-small" aria-label="地图图例">
    <span class="legend-item"><span class="legend-mark legend-fork" style="--mark-color:var(--viz-series-1)"></span>fork 专属</span>
    <span class="legend-item"><span class="legend-mark legend-jack" style="--mark-color:var(--viz-series-2)"></span>jack 专属</span>
    <span class="legend-item"><span class="legend-mark legend-shared" style="--mark-color:var(--viz-series-3)"></span>共享物理节点/路径</span>
    <span class="legend-item">虚线路径：倒向行驶</span>
  </div>

  <div class="scene-stage">
    <svg id="xiate-unified-svg" class="scene-svg" role="img" aria-labelledby="xiate-unified-title xiate-unified-desc" preserveAspectRatio="xMidYMid meet">
      <title id="xiate-unified-title">XiaTe fork 与 jack 统一分层地图</title>
      <desc id="xiate-unified-desc">显示 fork、jack 两组机器人专属路径以及共享物理节点和路径。可切换图层、拖拽、缩放并查看节点与路径详情。</desc>
      <defs>
        <pattern id="xiate-unified-grid-pattern" width="5" height="5" patternUnits="userSpaceOnUse">
          <path class="map-grid" d="M 5 0 L 0 0 0 5"></path>
        </pattern>
        <marker id="xiate-fork-arrow" markerWidth="5" markerHeight="5" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--viz-series-1)"></path>
        </marker>
        <marker id="xiate-jack-arrow" markerWidth="5" markerHeight="5" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--viz-series-2)"></path>
        </marker>
        <marker id="xiate-selected-arrow" markerWidth="5" markerHeight="5" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--scene-foreground)"></path>
        </marker>
      </defs>
      <g id="xiate-unified-world">
        <rect id="xiate-unified-backdrop" class="scene-backdrop"></rect>
        <rect id="xiate-unified-grid" fill="url(#xiate-unified-grid-pattern)"></rect>
        <path id="xiate-fork-background" class="background-cloud fork"></path>
        <path id="xiate-jack-background" class="background-cloud jack"></path>
        <g id="xiate-fork-hits"></g>
        <g id="xiate-jack-hits"></g>
        <g id="xiate-fork-edges"></g>
        <g id="xiate-jack-edges"></g>
        <g id="xiate-shared-overlays"></g>
        <g id="xiate-unified-nodes"></g>
      </g>
    </svg>
  </div>

  <div id="xiate-unified-detail" class="scene-detail text-small" aria-live="polite">拖拽平移 · 滚轮缩放 · 双击复位 · 点击节点或路径查看详情</div>
  <script type="application/json" id="xiate-unified-data">__XIATE_MAP_MODEL_JSON__</script>

  <script>
    (() => {
      const root = document.getElementById("xiate-unified-map-scene");
      const svg = document.getElementById("xiate-unified-svg");
      const backdrop = document.getElementById("xiate-unified-backdrop");
      const grid = document.getElementById("xiate-unified-grid");
      const forkBackground = document.getElementById("xiate-fork-background");
      const jackBackground = document.getElementById("xiate-jack-background");
      const forkHits = document.getElementById("xiate-fork-hits");
      const jackHits = document.getElementById("xiate-jack-hits");
      const forkEdges = document.getElementById("xiate-fork-edges");
      const jackEdges = document.getElementById("xiate-jack-edges");
      const sharedOverlays = document.getElementById("xiate-shared-overlays");
      const nodesGroup = document.getElementById("xiate-unified-nodes");
      const stats = document.getElementById("xiate-unified-stats");
      const detail = document.getElementById("xiate-unified-detail");
      const showFork = document.getElementById("xiate-show-fork");
      const showJack = document.getElementById("xiate-show-jack");
      const showShared = document.getElementById("xiate-show-shared");
      const model = JSON.parse(document.getElementById("xiate-unified-data").textContent);
      const svgNs = "http://www.w3.org/2000/svg";
      const nodeElements = [];
      const edgeElements = new Map();
      let selectedElement = null;
      let panState = null;

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS(svgNs, name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
        return element;
      }

      function pathData(item) {
        return `M ${item.p0[0]} ${-item.p0[1]} C ${item.p1[0]} ${-item.p1[1]}, ${item.p2[0]} ${-item.p2[1]}, ${item.p3[0]} ${-item.p3[1]}`;
      }

      function labelForNode(node) {
        const values = Object.values(node.aliases);
        return values.every((value) => value === values[0]) ? values[0] : values.join("/");
      }

      function cloudPath(background) {
        const commands = [];
        background.cells.forEach(([cellX, cellY]) => {
          commands.push(`M${(cellX * background.step).toFixed(2)},${(-cellY * background.step).toFixed(2)}h0.08`);
        });
        return commands.join("");
      }

      const bounds = model.metadata.bounds;
      const padding = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY) * 0.035;
      const initialView = {
        x: bounds.minX - padding,
        y: -bounds.maxY - padding,
        w: bounds.maxX - bounds.minX + padding * 2,
        h: bounds.maxY - bounds.minY + padding * 2,
      };
      let view = { ...initialView };

      function applyView() {
        svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
        const zoom = initialView.w / view.w;
        root.classList.toggle("show-station-labels", zoom > 1.45);
        root.classList.toggle("show-all-labels", zoom > 3.0);
      }

      function clearSelection() {
        if (selectedElement) {
          selectedElement.classList.remove("is-selected");
          if (selectedElement.classList.contains("edge")) {
            const group = selectedElement.dataset.group;
            selectedElement.setAttribute("marker-end", `url(#xiate-${group}-arrow)`);
          }
        }
        selectedElement = null;
      }

      function selectNode(node, element) {
        clearSelection();
        selectedElement = element;
        element.classList.add("is-selected");
        const aliases = Object.entries(node.aliases).map(([group, value]) => `${group}:${value}`).join(" · ");
        detail.textContent = `${node.id} · ${node.type} · ${node.groups.join("+")} · ${aliases} · 规范坐标 (${node.x.toFixed(3)}, ${node.y.toFixed(3)})`;
      }

      function selectEdge(edge, element) {
        clearSelection();
        selectedElement = element;
        element.classList.add("is-selected");
        element.setAttribute("marker-end", "url(#xiate-selected-arrow)");
        const shared = edge.sharedMatch ? ` · 共享候选 ${edge.sharedMatch}` : "";
        const movement = edge.motionDirection === 1 ? "倒向" : "正向";
        detail.textContent = `${edge.group} · ${edge.localStart} → ${edge.localEnd} · ${edge.length.toFixed(2)} m · ${movement} · ${edge.pathClass}${shared}`;
      }

      function updateLayers() {
        const forkVisible = showFork.checked;
        const jackVisible = showJack.checked;
        forkBackground.classList.toggle("layer-hidden", !forkVisible);
        forkHits.classList.toggle("layer-hidden", !forkVisible);
        forkEdges.classList.toggle("layer-hidden", !forkVisible);
        jackBackground.classList.toggle("layer-hidden", !jackVisible);
        jackHits.classList.toggle("layer-hidden", !jackVisible);
        jackEdges.classList.toggle("layer-hidden", !jackVisible);
        sharedOverlays.classList.toggle("layer-hidden", !showShared.checked || !forkVisible || !jackVisible);
        nodeElements.forEach(({ node, element }) => {
          const visible = node.groups.some((group) => group === "fork" ? forkVisible : jackVisible);
          element.classList.toggle("layer-hidden", !visible);
        });
        const visibleEdges = (forkVisible ? model.stats.forkEdgeCount : 0) + (jackVisible ? model.stats.jackEdgeCount : 0);
        const sharedText = showShared.checked && forkVisible && jackVisible ? ` · ${model.stats.sharedPathMatchCount} 对共享路径已高亮` : "";
        stats.textContent = `显示 ${visibleEdges} 条路径 · ${model.stats.canonicalNodeCount} 个规范节点${sharedText}`;
      }

      [backdrop, grid].forEach((element) => {
        element.setAttribute("x", initialView.x);
        element.setAttribute("y", initialView.y);
        element.setAttribute("width", initialView.w);
        element.setAttribute("height", initialView.h);
      });
      forkBackground.setAttribute("d", cloudPath(model.backgrounds.fork));
      jackBackground.setAttribute("d", cloudPath(model.backgrounds.jack));

      model.edges.forEach((edge) => {
        const edgePath = pathData(edge);
        const groupEdges = edge.group === "fork" ? forkEdges : jackEdges;
        const groupHits = edge.group === "fork" ? forkHits : jackHits;
        const visiblePath = createSvgElement("path", {
          d: edgePath,
          class: `edge ${edge.group}${edge.motionDirection === 1 ? " reverse-motion" : ""}`,
          "data-edge-id": edge.id,
          "data-group": edge.group,
          "marker-end": `url(#xiate-${edge.group}-arrow)`,
        });
        const hitPath = createSvgElement("path", {
          d: edgePath,
          class: "route-hit",
          "data-edge-id": edge.id,
          "data-group": edge.group,
        });
        const title = createSvgElement("title");
        title.textContent = `${edge.group}：${edge.localStart} 到 ${edge.localEnd}`;
        visiblePath.appendChild(title);
        hitPath.addEventListener("click", (event) => {
          event.stopPropagation();
          selectEdge(edge, visiblePath);
        });
        groupHits.appendChild(hitPath);
        groupEdges.appendChild(visiblePath);
        edgeElements.set(edge.id, visiblePath);
      });

      model.sharedOverlays.forEach((overlay) => {
        sharedOverlays.appendChild(createSvgElement("path", {
          d: pathData(overlay),
          class: "shared-overlay",
        }));
      });

      model.nodes.forEach((node) => {
        const shared = node.groups.length === 2;
        const groupClass = shared ? "shared" : `${node.groups[0]}-only`;
        const group = createSvgElement("g", {
          class: `node ${groupClass}`,
          "data-node-id": node.id,
          transform: `translate(${node.x} ${-node.y})`,
        });
        const radius = shared ? 0.43 : 0.34;
        let mark;
        if (shared) {
          mark = createSvgElement("polygon", {
            class: "node-mark",
            points: `0,${-radius} ${radius},0 0,${radius} ${-radius},0`,
          });
        } else if (node.groups[0] === "jack") {
          mark = createSvgElement("rect", {
            class: "node-mark",
            x: -radius,
            y: -radius,
            width: radius * 2,
            height: radius * 2,
          });
        } else {
          mark = createSvgElement("circle", { class: "node-mark", r: radius });
        }
        const title = createSvgElement("title");
        title.textContent = `${node.id}，${node.groups.join("+")}`;
        mark.appendChild(title);
        const label = createSvgElement("text", {
          class: `node-label${node.type === "LM" ? " lm-label" : " station-label"}`,
          x: radius + 0.22,
          y: -radius - 0.16,
          "font-size": node.type === "LM" ? 1.25 : 1.45,
        });
        label.textContent = labelForNode(node);
        group.appendChild(mark);
        group.appendChild(label);
        group.addEventListener("click", (event) => {
          event.stopPropagation();
          selectNode(node, group);
        });
        nodesGroup.appendChild(group);
        nodeElements.push({ node, element: group });
      });

      function clientToMap(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        return {
          x: view.x + ((clientX - rect.left) / rect.width) * view.w,
          y: view.y + ((clientY - rect.top) / rect.height) * view.h,
        };
      }

      svg.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".node, .route-hit")) return;
        panState = {
          pointerId: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          viewX: view.x,
          viewY: view.y,
          viewW: view.w,
          viewH: view.h,
        };
        svg.setPointerCapture(event.pointerId);
        svg.classList.add("is-panning");
      });

      svg.addEventListener("pointermove", (event) => {
        if (!panState || panState.pointerId !== event.pointerId) return;
        const rect = svg.getBoundingClientRect();
        view.x = panState.viewX - ((event.clientX - panState.clientX) / rect.width) * panState.viewW;
        view.y = panState.viewY - ((event.clientY - panState.clientY) / rect.height) * panState.viewH;
        applyView();
      });

      function endPan(event) {
        if (!panState || panState.pointerId !== event.pointerId) return;
        panState = null;
        svg.classList.remove("is-panning");
      }

      svg.addEventListener("pointerup", endPan);
      svg.addEventListener("pointercancel", endPan);

      svg.addEventListener("wheel", (event) => {
        event.preventDefault();
        const anchor = clientToMap(event.clientX, event.clientY);
        const factor = Math.exp(event.deltaY * 0.0012);
        const nextWidth = Math.min(initialView.w * 1.3, Math.max(initialView.w / 30, view.w * factor));
        const ratio = nextWidth / view.w;
        view.x = anchor.x - (anchor.x - view.x) * ratio;
        view.y = anchor.y - (anchor.y - view.y) * ratio;
        view.w = nextWidth;
        view.h *= ratio;
        applyView();
      }, { passive: false });

      svg.addEventListener("dblclick", () => {
        view = { ...initialView };
        applyView();
      });

      svg.addEventListener("click", () => {
        clearSelection();
        detail.textContent = "拖拽平移 · 滚轮缩放 · 双击复位 · 点击节点或路径查看详情";
      });

      [showFork, showJack, showShared].forEach((control) => control.addEventListener("change", updateLayers));
      applyView();
      updateLayers();
    })();
  </script>
</div>
